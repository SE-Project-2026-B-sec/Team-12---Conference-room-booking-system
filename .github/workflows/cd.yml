name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Reuses the CI workflow (jobs "Server" and "Client"); a failure here blocks image build and deploy.
  ci:
    uses: ./.github/workflows/ci.yml

  build-image:
    name: Build image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image name (ghcr.io requires lowercase)
        id: ref
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ref.outputs.name }}:${{ github.sha }}
            ${{ steps.ref.outputs.name }}:latest

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "\`${{ steps.ref.outputs.image }}\`"
            echo ""
            echo "Also tagged \`${{ steps.ref.outputs.name }}:latest\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Skipped unless the repo variable DEPLOY_ENABLED is 'true' and a self-hosted runner is registered.
  # Fallback without a runner: scripts/deploy-local.sh (see README, "CD / Deployment").
  deploy:
    name: Deploy
    needs: build-image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    env:
      CRBS_IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Provide .env from the runner machine (never from git)
        run: |
          src="${DEPLOY_ENV_FILE:-$HOME/crbs.env}"
          if [ ! -f "$src" ]; then
            echo "Missing $src. Create it from .env.example on the runner machine (or set DEPLOY_ENV_FILE)." >&2
            exit 1
          fi
          cp "$src" .env
        env:
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}

      - name: Pull the commit-tagged image
        run: docker pull "$CRBS_IMAGE"

      - name: Start the application and PostgreSQL
        run: docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d

      - name: Smoke test
        run: ./scripts/smoke-test.sh
